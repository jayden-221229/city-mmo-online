services:
  - type: web
    name: city-mmo-server
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: CORS_ORIGIN
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SAVE_KEY
        value: city-mmo:world
      - key: ACCOUNTS_KEY
        value: city-mmo:accounts
